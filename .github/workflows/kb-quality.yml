name: KB Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kb-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q tools tests validation
      - name: Validate schemas and repository consistency
        run: python tools/kb.py validate --strict
      - name: Verify generated artifacts
        run: python tools/kb.py generate --check
      - name: Validate Work Items
        run: python tools/work_item_validate.py
      - name: Validate rolling queue
        run: python tools/queue_validate.py all
      - name: Validate execution ledger chain
        run: python tools/ledger_validate.py
      - name: Test
        run: python -m pytest -q
