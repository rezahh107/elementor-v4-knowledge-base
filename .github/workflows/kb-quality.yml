name: KB Quality
run-name: KB Quality ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
  pull_request_target:
    types: [reopened, ready_for_review, labeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to validate
        required: true
        type: string
      expected_sha:
        description: Exact commit SHA expected after checkout
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kb-quality-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.action != 'labeled' || github.event.label.name == 'kb-quality-retry'))
    name: validate (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve checkout target
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
            echo "expected_sha=${{ inputs.expected_sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "expected_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "expected_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="${{ steps.target.outputs.expected_sha }}"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::Checked-out SHA $actual_sha does not match expected SHA $expected_sha."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q tools tests validation
      - name: Validate schemas and repository consistency
        run: python tools/kb.py validate --strict
      - name: Verify generated artifacts
        run: python tools/kb.py generate --check
      - name: Validate Work Items
        run: python tools/work_item_validate.py
      - name: Validate Work Package control plane
        run: python tools/work_package_validate.py all
      - name: Validate cross-file evidence contracts
        run: python tools/repository_consistency_validate.py
      - name: Validate rolling queue
        run: python tools/queue_validate.py all
      - name: Validate execution ledger chain
        run: python tools/ledger_validate.py
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/pytest-logs"
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest-logs/pytest-${{ matrix.python-version }}.log"
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-log-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pytest-logs
          if-no-files-found: warn
          retention-days: 7
