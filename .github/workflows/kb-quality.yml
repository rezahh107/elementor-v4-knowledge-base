name: KB Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to validate"
        required: true
        type: string
      expected_sha:
        description: "Exact commit SHA that the ref must resolve to"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kb-quality-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify workflow_dispatch expected SHA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "${{ inputs.expected_sha }}" ]; then
            echo "::error title=Expected SHA mismatch::ref '${{ inputs.ref }}' resolved to '$actual_sha', expected '${{ inputs.expected_sha }}'"
            exit 1
          fi
          echo "Validated exact workflow_dispatch head $actual_sha"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q tools tests validation
      - name: Validate schemas and repository consistency
        run: python tools/kb.py validate --strict
      - name: Verify generated artifacts
        run: python tools/kb.py generate --check
      - name: Validate Work Items
        run: python tools/work_item_validate.py
      - name: Validate cross-file evidence contracts
        run: python tools/repository_consistency_validate.py
      - name: Validate rolling queue
        run: python tools/queue_validate.py all
      - name: Validate execution ledger chain
        run: python tools/ledger_validate.py
      - name: Test
        run: python -m pytest -q
