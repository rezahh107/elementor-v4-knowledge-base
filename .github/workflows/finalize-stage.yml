name: Finalize Evidence Stage

on:
  workflow_dispatch:
    inputs:
      stage_id:
        description: Stage ID such as KB-004
        required: true
        type: string
      branch:
        description: Existing migration branch
        required: true
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: write

concurrency:
  group: stage-finalize-${{ github.event.pull_request.number || inputs.stage_id }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'evidence-ready' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve branch
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_STAGE: ${{ inputs.stage_id }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            branch="$INPUT_BRANCH"
            stage="$INPUT_STAGE"
          else
            branch="$PR_BRANCH"
            stage=""
          fi
          [[ "$branch" == migration/* || "$branch" == migration-* ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Resolve stage ID
        id: stage
        shell: bash
        env:
          EXPLICIT_STAGE: ${{ steps.target.outputs.stage }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          if [[ -n "$EXPLICIT_STAGE" ]]; then
            value="$EXPLICIT_STAGE"
          else
            value="$(python -c 'from tools.pipeline_common import infer_stage; import os; print(infer_stage(os.environ["TARGET_BRANCH"]))')"
          fi
          [[ "$value" =~ ^KB-[0-9]{3}$ ]]
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Finalize canonical stage data
        run: python tools/stage_finalize.py --stage '${{ steps.stage.outputs.value }}'
      - name: Generate derived artifacts
        run: python tools/kb.py generate
      - name: Validate work-item state
        run: python tools/work_item_validate.py
      - name: Validate repository strictly
        run: python tools/kb.py validate --strict
      - name: Verify generated artifacts
        run: python tools/kb.py generate --check
      - name: Run tests
        run: python -m pytest
      - name: Commit finalization artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifests/stages.yaml manifests/work-items.yaml ledger/executions.jsonl STATUS.md docs/_index.md manifests/coverage.yaml manifests/sources.yaml
          if git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git commit -m 'chore: finalize evidence stage ${{ steps.stage.outputs.value }}'
          git push origin HEAD:${{ steps.target.outputs.branch }}
