name: Finalize Evidence Stage

on:
  workflow_dispatch:
    inputs:
      stage_id:
        required: true
        type: string
      branch:
        required: true
        type: string
  issue_comment:
    types: [created]
  pull_request_target:
    types: [reopened, ready_for_review, edited, labeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: stage-finalize-${{ github.event.pull_request.number || github.event.issue.number || inputs.stage_id }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.body == '/finalize-stage' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'github-actions[bot]' &&
       (startsWith(github.event.pull_request.head.ref, 'migration/') ||
        startsWith(github.event.pull_request.head.ref, 'migration-')))
    permissions:
      contents: write
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_BRANCH: ${{ inputs.branch }}
          EXPLICIT_STAGE: ${{ inputs.stage_id }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          infer_stage_from_branch() {
            local value="$1"
            if [[ "$value" =~ (KB-[0-9]{3}) ]]; then
              printf '%s\n' "${BASH_REMATCH[1]}"
            else
              echo "could not infer stage from branch: $value" >&2
              exit 1
            fi
          }
          base="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$DEFAULT_BRANCH" | awk '{print $1}')"
          if [[ "$EVENT" == workflow_dispatch ]]; then
            branch="$INPUT_BRANCH"
            stage="$EXPLICIT_STAGE"
            [[ "$branch" == migration/* || "$branch" == migration-* ]]
            [[ "$stage" =~ ^KB-[0-9]{3}$ ]]
            head="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$branch" | awk '{print $1}')"
          elif [[ "$EVENT" == issue_comment ]]; then
            [[ "$COMMENT_BODY" == /finalize-stage ]]
            case "$AUTHOR_ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *) echo "unauthorized finalization command" >&2; exit 1 ;;
            esac
            pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$ISSUE_NUMBER")"
            branch="$(jq -r '.head.ref' <<<"$pr_json")"
            head="$(jq -r '.head.sha' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
            [[ "$head_repo" == "$GITHUB_REPOSITORY" ]]
            stage="$(infer_stage_from_branch "$branch")"
          else
            branch="$PR_BRANCH"
            head="$PR_HEAD"
            stage="$(infer_stage_from_branch "$branch")"
          fi
          [[ "$branch" == migration/* || "$branch" == migration-* ]]
          [[ "$head" =~ ^[a-f0-9]{40}$ && "$base" =~ ^[a-f0-9]{40}$ ]]
          [[ "$stage" =~ ^KB-[0-9]{3}$ ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ steps.target.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
      - name: Restore trusted tooling
        env:
          BASE: ${{ steps.target.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git cat-file -e "$BASE^{commit}"
          git restore --source="$BASE" --worktree -- tools schemas pyproject.toml
          python -m pip install -e ".[dev]"
      - id: document
        shell: bash
        env:
          STAGE: ${{ steps.target.outputs.stage }}
        run: |
          set -euo pipefail
          value="$(python -c 'from tools.pipeline_common import find_stage, load_stages; import os; print(find_stage(load_stages(), os.environ["STAGE"])["output_path"])')"
          [[ "$value" == docs/*.md ]]
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - id: claim
        shell: bash
        env:
          DOCUMENT: ${{ steps.document.outputs.value }}
          STAGE: ${{ steps.target.outputs.stage }}
        run: |
          set -euo pipefail
          value="$(python -c 'from pathlib import Path; from tools.kb import parse_front_matter; import os; print(parse_front_matter(Path(os.environ["DOCUMENT"]))[0]["claim_record"])')"
          [[ "$value" == evidence/claims/"$STAGE"*.yaml ]]
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Finalize and attest atomically
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.target.outputs.branch }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
          BASE_SHA: ${{ steps.target.outputs.base }}
          STAGE: ${{ steps.target.outputs.stage }}
          DOCUMENT: ${{ steps.document.outputs.value }}
          CLAIM: ${{ steps.claim.outputs.value }}
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          [[ "$remote" == "$HEAD_SHA" ]]
          python tools/bind_claim_locators.py "$STAGE"
          python tools/stage_finalize.py --stage "$STAGE" --phase prepare --expected-head "$HEAD_SHA"
          python tools/kb.py generate
          python tools/work_item_validate.py
          python tools/repository_consistency_validate.py
          python tools/kb.py generate --check
          python -m pytest -q
          git restore --source="$HEAD_SHA" --worktree -- tools schemas pyproject.toml
          while IFS= read -r path; do
            case "$path" in
              manifests/stages.yaml|manifests/work-items.yaml|manifests/evidence-gaps.yaml|manifests/coverage.yaml|manifests/sources.yaml|STATUS.md|docs/_index.md|"$DOCUMENT"|"$CLAIM") ;;
              *) echo "unexpected finalization path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$HEAD_SHA")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifests/stages.yaml manifests/work-items.yaml manifests/evidence-gaps.yaml manifests/coverage.yaml manifests/sources.yaml STATUS.md docs/_index.md "$DOCUMENT" "$CLAIM"
          git commit -m "chore: finalize evidence stage $STAGE"
          finalization_sha="$(git rev-parse HEAD)"
          mkdir -p "$RUNNER_TEMP/trusted/tools" "$RUNNER_TEMP/trusted/schemas"
          git show "$BASE_SHA:tools/stage_attest.py" > "$RUNNER_TEMP/trusted/tools/stage_attest.py"
          git show "$BASE_SHA:schemas/execution-event.schema.json" > "$RUNNER_TEMP/trusted/schemas/execution-event.schema.json"
          python -m pip install PyYAML jsonschema
          python -I "$RUNNER_TEMP/trusted/tools/stage_attest.py" --repo "$PWD" --stage "$STAGE" --finalization-commit "$finalization_sha"
          [[ "$(git diff --name-only)" == "ledger/executions.jsonl" ]]
          git add ledger/executions.jsonl
          git commit -m "ledger: attest finalization for $STAGE"
          remote="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          [[ "$remote" == "$HEAD_SHA" ]]
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
      - name: Report finalizer failure
        if: failure() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          STAGE: ${{ steps.target.outputs.stage }}
          BRANCH: ${{ steps.target.outputs.branch }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          stage="${STAGE:-unknown}"
          branch="${BRANCH:-unknown}"
          head_sha="${HEAD_SHA:-unknown}"
          gh pr comment "$PR_NUMBER" --body "Finalizer failed for ${stage} on branch ${branch} at head ${head_sha}. Run: ${RUN_URL}"
