name: Work Package Control Plane

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: work-package-control-plane
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate Work Package contracts
        run: python tools/work_package_validate.py all
      - name: Capture current GitHub state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/github_state_snapshot.py --repository "${{ github.repository }}" --output "${{ runner.temp }}/repo-state.json"
      - name: Produce deterministic plan
        run: python tools/work_package_controller.py --repo-state "${{ runner.temp }}/repo-state.json" --output "${{ runner.temp }}/work-package-plan.json"
      - name: Publish plan summary
        if: always()
        shell: bash
        run: |
          echo '## Work Package Control Plane' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "${{ runner.temp }}/work-package-plan.json" ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "${{ runner.temp }}/work-package-plan.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Plan file was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload observed state and plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work-package-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/repo-state.json
            ${{ runner.temp }}/work-package-plan.json
          if-no-files-found: error
          retention-days: 30
