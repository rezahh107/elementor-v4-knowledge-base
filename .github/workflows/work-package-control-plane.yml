name: Work Package Control Plane

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: work-package-control-plane
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - run: python tools/work_package_validate.py
      - name: Capture current GitHub state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/github_state_snapshot.py --repository ${{ github.repository }} --output /tmp/repo-state.json
      - run: python tools/work_package_controller.py --repo-state /tmp/repo-state.json
