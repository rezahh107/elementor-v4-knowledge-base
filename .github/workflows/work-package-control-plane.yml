name: Work Package Control Plane

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: work-package-control-plane
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate Work Package contracts
        run: python tools/work_package_validate.py all
      - name: Capture current GitHub state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/github_state_snapshot.py --repository "${{ github.repository }}" --output /tmp/repo-state.json
      - name: Produce deterministic plan
        run: python tools/work_package_controller.py --repo-state /tmp/repo-state.json --output /tmp/work-package-plan.json
      - name: Publish plan summary
        shell: bash
        run: |
          echo '## Work Package Control Plane' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/work-package-plan.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
