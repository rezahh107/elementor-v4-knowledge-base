name: Work Package Control Plane

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: work-package-control-plane
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate Work Package contracts
        run: python tools/work_package_validate.py all
      - name: Capture current GitHub state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/github_state_snapshot.py --repository "${{ github.repository }}" --output "${{ runner.temp }}/repo-state.json"
      - name: PR-Inspector read-only gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh repo clone rezahh107/PR-Inspector "$RUNNER_TEMP/pr-inspector" -- --depth 1
          python - <<'PY'
          from pathlib import Path
          import sys
          import yaml
          root = Path(__import__('os').environ['RUNNER_TEMP']) / 'pr-inspector'
          manifest = yaml.safe_load((root / 'protocol-manifest.yaml').read_text(encoding='utf-8'))
          errors = []
          if manifest.get('operation_mode') != 'read_only_review':
              errors.append('PR-Inspector operation_mode is not read_only_review')
          forbidden = set(manifest.get('forbidden_default_actions') or [])
          required_forbidden = {'modify_target_repository', 'create_comment', 'approve_pull_request', 'merge_pull_request'}
          missing = sorted(required_forbidden - forbidden)
          if missing:
              errors.append('PR-Inspector manifest missing forbidden actions: ' + ', '.join(missing))
          command = manifest.get('validation_commands', {}).get('repository')
          if not isinstance(command, str) or not command:
              errors.append('PR-Inspector repository validation command missing')
          if errors:
              for error in errors:
                  print('ERROR:', error, file=sys.stderr)
              raise SystemExit(1)
          PY
          cd "$RUNNER_TEMP/pr-inspector"
          if [[ -f scripts/validate_repository_v2.py ]]; then
            python scripts/validate_repository_v2.py
          else
            echo "ERROR: PR-Inspector manifest references scripts/validate_repository_v2.py but the file is absent." >&2
            exit 1
          fi
      - name: Reconcile lifecycle before planning
        id: lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python tools/pr_lifecycle_reconcile.py \
            --repo-state "${{ runner.temp }}/repo-state.json" \
            --output "${{ runner.temp }}/lifecycle-plan.json" \
            --apply
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" != "0" && "$status" != "2" ]]; then
            exit "$status"
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          plan = json.loads(Path(__import__('os').environ['RUNNER_TEMP'], 'lifecycle-plan.json').read_text(encoding='utf-8'))
          print('new_work_allowed=' + ('true' if plan['planner_gate']['new_work_allowed'] else 'false'))
          PY
      - name: Produce deterministic plan
        if: steps.lifecycle.outputs.new_work_allowed == 'true'
        run: python tools/work_package_controller.py --repo-state "${{ runner.temp }}/repo-state.json" --output "${{ runner.temp }}/work-package-plan.json"
      - name: Record planner gate block
        if: steps.lifecycle.outputs.new_work_allowed != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          lifecycle = json.loads((Path(os.environ['RUNNER_TEMP']) / 'lifecycle-plan.json').read_text(encoding='utf-8'))
          blocked = {
            'action': 'blocked',
            'reason': 'lifecycle_reconciliation_required',
            'planner_gate': lifecycle['planner_gate'],
            'work_package': None,
          }
          (Path(os.environ['RUNNER_TEMP']) / 'work-package-plan.json').write_text(json.dumps(blocked, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Publish plan summary
        if: always()
        shell: bash
        run: |
          echo '## Work Package Control Plane' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "${{ runner.temp }}/lifecycle-plan.json" ]]; then
            echo '### Lifecycle plan' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "${{ runner.temp }}/lifecycle-plan.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "${{ runner.temp }}/work-package-plan.json" ]]; then
            echo '### Work Package plan' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "${{ runner.temp }}/work-package-plan.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Plan file was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload observed state and plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work-package-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/repo-state.json
            ${{ runner.temp }}/lifecycle-plan.json
            ${{ runner.temp }}/work-package-plan.json
          if-no-files-found: error
          retention-days: 30
