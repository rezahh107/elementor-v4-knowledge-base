name: Capture Source Evidence

on:
  workflow_dispatch:
    inputs:
      stage_id:
        description: Stage ID such as KB-004
        required: true
        type: string
      branch:
        description: Existing migration branch
        required: true
        type: string
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: source-capture-${{ github.event.pull_request.number || inputs.stage_id }}
  cancel-in-progress: false

jobs:
  compute:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'github-actions[bot]' &&
       (startsWith(github.event.pull_request.head.ref, 'migration/') ||
        startsWith(github.event.pull_request.head.ref, 'migration-')))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.target.outputs.branch }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      stage: ${{ steps.stage.outputs.value }}
    steps:
      - name: Resolve immutable target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ inputs.branch }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            branch="$INPUT_BRANCH"
            [[ "$branch" == migration/* || "$branch" == migration-* ]]
            head_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$branch" | awk '{print $1}')"
          else
            branch="$PR_BRANCH"
            head_sha="$PR_HEAD"
          fi
          [[ "$head_sha" =~ ^[a-f0-9]{40}$ ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact target
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ steps.target.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
      - name: Restore trusted tooling from base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          git restore --source="$BASE_SHA" --worktree -- tools schemas pyproject.toml
      - name: Install trusted project
        run: python -m pip install -e ".[dev]"
      - name: Resolve stage ID
        id: stage
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPLICIT_STAGE: ${{ inputs.stage_id }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            value="$EXPLICIT_STAGE"
          else
            value="$(python -c 'from tools.pipeline_common import infer_stage; import os; print(infer_stage(os.environ["TARGET_BRANCH"]))')"
          fi
          [[ "$value" =~ ^KB-[0-9]{3}$ ]]
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Capture and validate source evidence
        env:
          TARGET_HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          python tools/source_capture.py --stage '${{ steps.stage.outputs.value }}' --artifact-dir "$RUNNER_TEMP/capture"
          python tools/work_item_validate.py
          python tools/kb.py validate --strict
      - name: Build allowlisted patch
        shell: bash
        env:
          TARGET_HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail
          git restore --source="$TARGET_HEAD_SHA" --worktree -- tools schemas pyproject.toml
          while IFS= read -r path; do
            case "$path" in
              evidence/sources/*|manifests/work-items.yaml) ;;
              *) echo "unexpected capture path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$TARGET_HEAD_SHA")
          mkdir -p "$RUNNER_TEMP/out"
          git diff --binary "$TARGET_HEAD_SHA" -- evidence/sources manifests/work-items.yaml > "$RUNNER_TEMP/out/source.patch"
          cp -R "$RUNNER_TEMP/capture" "$RUNNER_TEMP/out/source-snapshots"
      - name: Upload capture result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-capture-${{ steps.target.outputs.head_sha }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30

  writeback:
    needs: compute
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable target
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.compute.outputs.head_sha }}
          fetch-depth: 0
      - name: Download capture result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-capture-${{ needs.compute.outputs.head_sha }}
          path: ${{ runner.temp }}/out
      - name: Verify, apply, and push
        shell: bash
        env:
          TARGET_BRANCH: ${{ needs.compute.outputs.branch }}
          TARGET_HEAD_SHA: ${{ needs.compute.outputs.head_sha }}
          STAGE_ID: ${{ needs.compute.outputs.stage }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          [[ "$remote_head" == "$TARGET_HEAD_SHA" ]]
          patch="$RUNNER_TEMP/out/source.patch"
          if [[ ! -s "$patch" ]]; then
            echo "No source-capture changes to write."
            exit 0
          fi
          git apply --check "$patch"
          git apply "$patch"
          while IFS= read -r path; do
            case "$path" in
              evidence/sources/*|manifests/work-items.yaml) ;;
              *) echo "unexpected writeback path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$TARGET_HEAD_SHA")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/sources manifests/work-items.yaml
          git commit -m "evidence: capture official source for $STAGE_ID"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          [[ "$remote_head" == "$TARGET_HEAD_SHA" ]]
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
